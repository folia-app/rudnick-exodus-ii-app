    <section>
<pre data-offset="171.2109375">
Verdant Perjury;
life, pixellized in ghost loams
warps, quickens, recedes.
</pre>
<div>
  <small>EIGHT</small>
  <div id="datetime" class="flex justify-center leading-none">
    <div id="date" class="number">2021.06.12 23:37:05 -0400</div>
    <div id="countdown" class="flex" style="display: none;">
      <div>
        <div id="year" class="number">00</div>
        <small class="block">YEAR</small>
      </div>
      <div class="mx-5">:</div>
      
      <div>
        <div id="day" class="number">000</div>
        <small class="block">DAY</small>
      </div>
      <div class="mx-5">:</div>
      
      <div>
        <div id="hour" class="number">00</div>
        <small class="block">HOUR</small>
      </div>
      <div class="mx-5">:</div>
      
      <div>
        <div id="min" class="number">00</div>
        <small class="block">MIN</small>
      </div>
      <div class="mx-5">:</div>
      
      <div>
        <div id="sec" class="number">00</div>
        <small class="block">SEC</small>
      </div>
      <div class="mx-5">:</div>
      
      <div>
        <div id="msec" class="number">000</div>
        <small class="block">MSEC</small>
      </div>
    </div>
  </div>
</div>
    </section>

    <script type="text/javascript">
      (function () {
        const start = 'Sun Jun 05 2021 20:24:26 GMT-0400'
        const offset = document.querySelector('pre').getAttribute('data-offset') // hours
        const endMs = new Date(start).getTime() + Number(offset) * 60 * 60 * 1000
        
        let anim
        
        const els = {
          year: [document.getElementById('year'), 2],
          day: [document.getElementById('day'), 3],
          hour: [document.getElementById('hour'), 2],
          min: [document.getElementById('min'), 2],
          sec: [document.getElementById('sec'), 2],
          msec: [document.getElementById('msec'), 3]
        }
      
        function getTimeUntil (milliseconds, separator = ' - ', omittSeconds, omittDays) {
          let hour, minute, seconds, day

          seconds = Math.floor(milliseconds / 1000)
          milliseconds = Math.floor(milliseconds % 1000) // ms remaining (after seconds determination)

          minute = Math.floor(seconds / 60)
          seconds = seconds % 60

          hour = Math.floor(minute / 60)
          minute = minute % 60

          day = Math.floor(hour / 24)
          hour = hour % 24

          const year = Math.floor(day / 365.25)
          day = Math.floor(day % 365.25)

          const time = {
            year: year,
            day: day,
            hour: hour,
            min: minute,
            sec: seconds,
            msec: milliseconds
          }

          return time
        }

        function play () {
          const nowMs = new Date().getTime()
          const msUntil = endMs - nowMs
          // end ??
          if (msUntil <= 0) {
            pause()
            return
          }
          // update
          const time = getTimeUntil(msUntil)
          Object.keys(els).forEach(key => {
            els[key][0].innerText = ('000' + time[key]).slice(els[key][1] * -1)
          })
          // animation loop
          anim = requestAnimationFrame(() => play())
        }

        function pause () {
          cancelAnimationFrame(anim)
        }

        function init () {
          const nowMs = new Date().getTime()
          if (endMs < nowMs) {
            document.body.classList.remove('pending')
            // show if was hidden (timer runs out)
            document.getElementById('date').style.display = ''
            document.getElementById('countdown').style.display = 'none'
          } else {
            document.getElementById('date').style.display = 'none'
            document.getElementById('countdown').style.display = 'flex'
            play()
          }
        }

        init()
      })()
    </script>
